<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="glowViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.25" />
    </pattern>

    <!-- Animations -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1.5deg); }
      }
      @keyframes pulseLight {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(1.08); }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes orbitCard {
        0% { transform: translate(0, 0); }
        50% { transform: translate(-8px, -6px); }
        100% { transform: translate(0, 0); }
      }

      .floating-pill-1 { animation: floatSlow 7s ease-in-out infinite; transform-origin: center; }
      .floating-pill-2 { animation: floatReverse 8s ease-in-out infinite; transform-origin: center; }
      .floating-pill-3 { animation: floatSlow 6s ease-in-out infinite 1s; transform-origin: center; }
      .floating-pill-4 { animation: floatReverse 9s ease-in-out infinite 0.5s; transform-origin: center; }
      .floating-card-1 { animation: orbitCard 10s ease-in-out infinite; }
      .glowing-orb-1 { animation: pulseLight 6s ease-in-out infinite; transform-origin: 300px 180px; }
      .glowing-orb-2 { animation: pulseLight 7s ease-in-out infinite 2s; transform-origin: 900px 200px; }
      .flow-stream { stroke-dasharray: 12 16; animation: dashFlow 20s linear infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="380" rx="16" fill="url(#grid)" />

  <!-- Animated Glowing Ambient Lights (Background Layer) -->
  <circle class="glowing-orb-1" cx="280" cy="180" r="180" fill="url(#glowViolet)" />
  <circle class="glowing-orb-2" cx="940" cy="190" r="190" fill="url(#glowCyan)" />

  <!-- Flowing Network Lines in Background -->
  <path class="flow-stream" d="M 50,90 Q 300,40 600,120 T 1150,80" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" />
  <path class="flow-stream" d="M 80,310 Q 400,340 700,280 T 1120,300" fill="none" stroke="url(#lineGrad)" stroke-width="2" />

  <!-- Background Floating Decorative Pills / UI Badges (Kept to sides so center title stays clear) -->
  <g class="floating-pill-1" opacity="0.75">
    <rect x="70" y="80" width="130" height="36" rx="18" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1.2" filter="url(#softShadow)" />
    <circle cx="90" cy="98" r="6" fill="#38bdf8" />
    <text x="106" y="103" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">&lt;HTML5 /&gt;</text>
  </g>

  <g class="floating-pill-2" opacity="0.75">
    <rect x="110" y="240" width="145" height="36" rx="18" fill="url(#pillGrad)" stroke="#a855f7" stroke-width="1.2" filter="url(#softShadow)" />
    <circle cx="130" cy="258" r="6" fill="#c084fc" />
    <text x="145" y="263" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Visual Builder</text>
  </g>

  <g class="floating-pill-3" opacity="0.75">
    <rect x="1000" y="75" width="130" height="36" rx="18" fill="url(#pillGrad)" stroke="#818cf8" stroke-width="1.2" filter="url(#softShadow)" />
    <circle cx="1020" cy="93" r="6" fill="#818cf8" />
    <text x="1035" y="98" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">{ CSS3 / JS }</text>
  </g>

  <g class="floating-pill-4" opacity="0.75">
    <rect x="975" y="245" width="155" height="36" rx="18" fill="url(#pillGrad)" stroke="#34d399" stroke-width="1.2" filter="url(#softShadow)" />
    <circle cx="995" cy="263" r="6" fill="#34d399" />
    <text x="1010" y="268" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Open Source</text>
  </g>

  <!-- Foreground Content (Solid, Crisp, Unobscured) -->
  <!-- Top Category Tag -->
  <g transform="translate(600, 75)">
    <rect x="-140" y="-18" width="280" height="34" rx="17" fill="url(#badgeGrad)" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.6" filter="url(#softShadow)" />
    <text x="0" y="4" text-anchor="middle" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">★ CURATED AWESOME LIST ★</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(600, 155)">
    <text x="0" y="0" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#softShadow)">
      Web Design &amp; Development Software
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 205)">
    <text x="0" y="0" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" letter-spacing="0.2">
      Visual Site Builders • Code Editors • Design Platforms • Self-Hosted Stacks
    </text>
  </g>

  <!-- Highlights & Tags Footer Bar -->
  <g transform="translate(600, 275)">
    <!-- Pill 1 -->
    <g transform="translate(-330, 0)">
      <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🎨 Visual Builders</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-110, 0)">
      <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">💻 Web IDEs &amp; Editors</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(110, 0)">
      <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ No-Code / Low-Code</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(330, 0)">
      <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🔓 100% Self-Hosted</text>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="374" width="1200" height="6" fill="url(#titleGrad)" />
</svg>
